; CCon - the defaults file.  Copy to L:ccon.cfg to take effect.
;
; EVERY key below is an ordinary CCON: open-string option, so
; anything that works in "newshell CCON:..." works here - and an
; open string always outranks what is written in this file:
;
;     built-in  <  L:ccon.cfg  <  the open string
;
; Syntax
;   ; or #     comment, to end of line (so neither may appear
;              inside a value)
;   [name]     opens a section; it runs to the next [ or to the
;              end of the file - there is no END to write
;   KEY=value  one per line.  Unknown keys are ignored, which is
;              what lets an older handler read a newer file.
;
; Lines before the first [section] belong to [DEFAULT], so a file
; with no sections in it at all is perfectly valid.
;
; Every key here is COMMENTED OUT and shows its built-in default,
; so this file is a complete reference and copying it changes
; nothing until you uncomment a line.  That matters for more than
; tidiness: several defaults are DERIVED at window-open time and no
; literal value can reproduce them - see FONT and the DIRS/HIDDEN/
; GHOST note below.  Writing a number there does not restate the
; default, it replaces it.

[DEFAULT]

; ---------------------------------------------------------------
; WHERE THE WINDOW OPENS
; ---------------------------------------------------------------
; RIGHT and BOTTOM are EDGES, not sizes.  The window spans
; LEFT..RIGHT across and TOP..BOTTOM down, so the size follows from
; the pair:  width = RIGHT - LEFT,  height = BOTTOM - TOP.
; Nothing to write as 639: the edge is the edge.
;
;   LEFT=0   RIGHT=640    a 640-wide window at the left margin
;   LEFT=100 RIGHT=640    a 540-wide window starting 100 in
;   RIGHT=-1              fill to the screen edge from wherever
;                         LEFT put us - the only spelling that
;                         means "fill" no matter what LEFT says
;
; A right edge left of LEFT clamps to the 160x60 minimum window.

;LEFT=0
;TOP=18
;RIGHT=640         ; with LEFT=0 that is the built-in 640 width
;BOTTOM=148        ; with TOP=18 that is the built-in 130 height

; ---------------------------------------------------------------
; SCROLLBACK
; ---------------------------------------------------------------
; Lines of history kept behind the window.  Floored at 100 (and at
; the visible row count, whichever is larger), capped at 5000.
; LINES=0 means "use the built-in", so 0 is the way to un-set it.
; Three bytes per cell: 2000 lines at 80 columns is about 480K.

;LINES=512

; ---------------------------------------------------------------
; FONT
; ---------------------------------------------------------------
; name/size.  ".font" is added when you leave it off, and is legal
; if you write it (topaz.font/8 works).  Must be non-proportional;
; a proportional font is refused and topaz 8 used instead.
;
; THE DEFAULT IS NOT A NAME.  With no FONT line, a window opens in
; whatever Font Prefs has set as "System Default Text" - so there
; is no value that means "the default".  NOFONT restores it.

;FONT=topaz/8

; ---------------------------------------------------------------
; COLOURS - pen numbers.  Palette Prefs shows the index next to
; the RGB sliders; that index is what goes here.
; ---------------------------------------------------------------
; Pen 0 is refused everywhere below.  The window's own clear is a
; RectFill in pen 0, so pen 0 IS the background: text drawn in it
; is not dim, it is gone.

;TEXT=1            ; the text pen, 1..15.  PEN=1 is the same key -
                   ; PEN is the older spelling and is not going away

; A note on TEXT and speed, because the cost is a step and not a
; slope.  CCon skips bitplanes the text has never used when it
; scrolls - the same trick the ROM's own console.device plays - and
; there are three settings: pens 0-1, pens 0-3, or everything.  A
; full-window scroll measured 8.8ms / 17.4ms / 34.8ms across those
; three, with the middle one landing on stock CON:'s speed to the
; decimal.  So TEXT=1 is the fast one, 2 and 3 cost the same as
; stock, and 4 upwards doubles that.
;
; It is a FLOOR, though, not a ceiling: the window remembers every
; pen it has ever drawn with, so the first coloured output - any
; ls with colours, any ANSI escape - moves it to the top step for
; good.  TEXT only decides the cost of a window that stays plain.
; None of this applies on a CyberGraphX or other RTG screen, where
; there are no bitplanes to skip, and DIRS/HIDDEN/GHOST never
; affect it at all - those are drawn outside the scrolled region.

; DIRS, HIDDEN and GHOST are DERIVED FROM YOUR SCREEN when left
; out, and that is nearly always the better answer: the derivation
; exists because fixed pen numbers looked wrong on a CyberGraphX
; screen, wrong again on a dark CTerm palette, and wrong a third
; time on the no-startup-sequence boot shell.  DIRS follows the
; screen's own "fill" pen role; HIDDEN and GHOST are picked by
; scanning the palette for a pen that stays readable against the
; background and still reads as dimmer than the text.
;
; Pin one only if you know your palette and dislike what the screen
; chose.  There is no number that means "go back to deriving" -
; comment the line out again.  Range 1..255 (these are drawn
; straight to the screen and are not limited to 15 like TEXT).

;DIRS=3            ; completion menu: directories
;HIDDEN=5          ; completion menu: entries with the h protection
                   ; bit, and .info files (ls's rule)
;GHOST=5           ; the inline suggestion, and the paste-queue hint

; WBPENS declares the screen's palette to be truly ANSI, so a
; program that hardcodes the classic Workbench pens (C:Ed prints
; its body text as SGR 31) is translated instead of taken
; literally.  Off unless asked for; NOWBPENS turns it back off.

;NOWBPENS

; ---------------------------------------------------------------
; SCREEN
; ---------------------------------------------------------------
; Open on a named public screen.  With no SCREEN line, windows go
; to the default public screen (usually Workbench), which is what
; NOSCREEN restores.

;SCREEN=Workbench

; ---------------------------------------------------------------
; WINDOW FURNITURE - the default is listed first on each line
; ---------------------------------------------------------------

;CLOSE             ; CLOSE / NOCLOSE      - the close gadget
;BORDER            ; BORDER / NOBORDER
;DRAG              ; DRAG / NODRAG        - the drag bar
;DEPTH             ; DEPTH / NODEPTH      - the depth gadget
;SIZE              ; SIZE / NOSIZE        - the sizing gadget
;NOBACKDROP        ; NOBACKDROP / BACKDROP
;ACTIVE            ; ACTIVE / INACTIVE    - activate the new window

; ---------------------------------------------------------------
; BEHAVIOUR - the default is listed first on each line
; ---------------------------------------------------------------

;NOWAIT            ; NOWAIT / WAIT
                   ; WAIT keeps the window up after the last handle
                   ; closes, so you can read what a command printed.
                   ; It turns the close gadget on: something has to
                   ; end the window.
;NOAUTO            ; NOAUTO / AUTO
                   ; AUTO makes the open succeed with no window at
                   ; all; the window appears on the first real I/O.
;NOPASTEEXEC       ; NOPASTEEXEC / PASTEEXEC
                   ; Right-Amiga-V queues pasted lines and runs one
                   ; on each Enter.  PASTEEXEC opts this window back
                   ; into the old behaviour where every pasted line
                   ; runs as it lands.  Right-Amiga-Shift-V does
                   ; that for a single paste without this.

; ---------------------------------------------------------------
; NOT SETTABLE FROM THIS FILE
; ---------------------------------------------------------------
; WINDOW0x<address> is refused here on purpose.  It hands a window
; an existing Intuition frame to draw in (CTerm's handoff uses it),
; and an address stored in a file names a window that died with the
; last reboot.  It stays an open-string option, where the pointer
; is fresh by construction.

; ---------------------------------------------------------------
; SECTIONS
; ---------------------------------------------------------------
; A section is a named set of overrides on top of [DEFAULT].  They
; are parsed today but not yet selectable - CONFIG=<name> in an
; open string arrives in a later beta, along with DEFAULTS (open
; the window on the built-ins, ignoring this file entirely).
; Until then, [DEFAULT] is what every window gets.

[tall]
;BOTTOM=-1
;LINES=4000
;NOCLOSE
